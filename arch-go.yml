version: 1

# Thresholds for validation
threshold:
  compliance: 100 # All rules must pass
  coverage: 70 # At least 70% of packages must be covered by rules

# Exclude common directories from analysis
excludedPaths:
  - 'vendor/**'
  - '**/*_test.go'
  - '**/mocks/**'
  - '**/testdata/**'

# Architecture dependency rules - Clean Architecture enforcement
dependenciesRules:
  # Domain Layer (Innermost) - Pure business logic, NO external dependencies
  - package: '**.domain.**'
    shouldNotDependsOn:
      internal:
        - '**.application.**'
        - '**.ports'
        - '**.adapters.**'
        - '**.infra.**'
    description: 'Domain layer must be pure - no dependencies on outer layers'

  # Ports Layer - Interfaces that define contracts, only depends on domain
  - package: '**.ports'
    shouldOnlyDependsOn:
      internal:
        - '**.domain.**'
    description: 'Ports layer defines interfaces and only depends on domain'

  # Application Layer - Use cases/business operations, depends on domain and ports
  - package: '**.application'
    shouldOnlyDependsOn:
      internal:
        - '**.domain.**'
        - '**.ports'
    description: 'Application layer depends on domain and ports only'

  # Handler Adapters (Primary/Inbound) - HTTP/gRPC handlers
  - package: '**.adapters.handler.**'
    shouldOnlyDependsOn:
      internal:
        - '**.application'
        - '**.domain.**'
        - '**.ports'
    description: 'Handler adapters depend on application, domain, and ports only'

  # Repository Adapters (Secondary/Outbound) - Database access
  - package: '**.adapters.repository.**'
    shouldOnlyDependsOn:
      internal:
        - '**.domain.**'
        - '**.ports'
    description: 'Repository adapters implement ports, depend only on domain and ports'

  # Event Adapters - Event publishing/handling
  - package: '**.adapters.events.**'
    shouldOnlyDependsOn:
      internal:
        - '**.domain.**'
        - '**.ports'
    description: 'Event adapters depend only on domain and ports'

  # Infrastructure Layer - Configuration and cross-cutting concerns
  - package: '**.infra.**'
    shouldOnlyDependsOn:
      internal:
        - '**.domain.**'
    description: 'Infrastructure layer should only depend on domain for type definitions'

  # Main Entry Point - Minimal bootstrap
  # NOTE: cmd should NOT import internal packages directly, only the composition root
  - package: '**.cmd.**'
    shouldNotDependsOn:
      internal:
        - '**.application'
        - '**.adapters.**'
        - '**.infra.**'
        - '**.domain.**'
        - '**.ports'
    description: 'Main package should not import internal packages directly, only composition root'
