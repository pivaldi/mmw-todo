# Mise configuration for Todo API project
# https://mise.jdx.dev/
[settings]
experimental = true
quiet = true

[tools]
go = "latest"
golangci-lint = "latest"
zellij = "latest"
# pinning a specific version is a strict best practice for mockery.
"go:github.com/vektra/mockery/v3" = "v3.7.0"

[shell_alias]
dev = "mise run run:dev"
build = "mise run build"
deploy = "mise run deploy"
r = "mise run"

[vars]
CONTRACTS_DIR = "{{config_root}}/../../contracts"
GOTESTSUM_OPTIONS = "--format testdox"
MIGRATIONS_DIR= "{{config_root}}/internal/infra/persistence/migrations/scripts"
COMPILE_OPTIONS="-tags no_clickhouse,no_mysql,no_mssql"
BINARY_NAME = "todo"
BINARY_PATH = "./cmd/todo"
BUILD_DIR = "bin"

# Environment variables
[env]
_.file = ".envrc"  # Load .envrc file if it exists
APP_ENV = { required = true }
APP_NAME = { required = true }
DB_PASSWORD="postgres" # TODO: make it secret
DB_URL="postgres://postgres:{{env.DB_PASSWORD}}@localhost:5435/mmw?sslmode=disable"

[tasks.setup]
description = "Update Repo Deps"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/common/libs/st.bash

  st.quiet

  st.h1 'Fix GOPRIVATE for this project'
  st.doing go env -w "GOPRIVATE=github.com/pivaldi/mmw-*"
  st.done
  st.doing go env -w "GOPRIVATE=github.com/piprim/mmw"
  st.done

  st.h1 'Update Repo Deps'
  st.doing "Go Mod Tidy"
  st.do go mod tidy
  st.done
  st.doing "Go Mod Download"
  st.do go mod download
  st.done
  """

[tasks.tools]
description = "Install needed tools awares APP_ENV value"
run = "scripts/common/install-tools-ss.sh"

[tasks."tools:update"]
description = "Install/Update needed tools"
run = "UPDATE=true scripts/common/install-tools-ss.sh"

[tasks.pre-commit]
depends = ["arch:check", "buf:lint"]
description = "Pre-commit checks (can be run manually or as git hook)"
run = "APP_ROOT_PATH={{config_root}} ./scripts/common/pre-commit.sh"
alias = "pc"

# Development tasks
[tasks.generate]
depends = ["buf:generate"]
description = "Generate code from protobuf definitions and Go enums"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/common/libs/st.bash

  st.quiet

  st.doing 'Generating Go Code'
  cd {{config_root}} || exit 1
  st.do go generate ./...
  st.done
 """

[tasks."generate:mocks"]
description = "Generate Go mocks for application ports"
run = "mockery"

[tasks."buf:generate"]
description = "Generate the protocol buffer code"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/common/libs/st.bash

  st.quiet

  st.doing 'Generating Proto'
  cd {{vars.CONTRACTS_DIR}}
  st.do buf generate --template buf.gen.todo.yaml
  st.done
"""

[tasks."buf:deps"]
description = "Download buf dependencies"
run = """
cd {{vars.CONTRACTS_DIR}}
buf mod update
"""

[tasks."buf:lint"]
description = "Lint protobuf files"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/common/libs/st.bash

  st.quiet

  cd {{vars.CONTRACTS_DIR}}
  st.doing "Linting proto file"
  st.do buf lint proto
"""

[tasks."buf:format"]
description = "Format protobuf files (Todo API only)"
run = """
cd {{vars.CONTRACTS_DIR}}
buf format -w proto/todo
"""

[tasks."buf:breaking"]
description = "Check for breaking changes in protobuf (Todo API only)"
run = """
cd {{vars.CONTRACTS_DIR}}
buf breaking --against '.git#branch=master' proto/todo
"""

[tasks.build]
description = "Build the application binary"
depends = ["generate"]
run = """
[ -e {{vars.BUILD_DIR}} ] || mkdir -p {{vars.BUILD_DIR}}
go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/{{vars.BINARY_NAME}} -v {{vars.BINARY_PATH}}
"""

[tasks."build:linux"]
description = "Build for Linux"
depends = ["generate"]
run = """
mkdir -p {{vars.BUILD_DIR}}
GOOS=linux GOARCH=amd64 go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/{{vars.BINARY_NAME}}-linux-amd64 -v {{vars.BINARY_PATH}}
"""

[tasks."build:darwin"]
description = "Build for macOS"
depends = ["generate"]
run = """
mkdir -p {{vars.BUILD_DIR}}
GOOS=darwin GOARCH=amd64 go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/{{vars.BINARY_NAME}}-darwin-amd64 -v {{vars.BINARY_PATH}}
GOOS=darwin GOARCH=arm64 go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/{{vars.BINARY_NAME}}-darwin-arm64 -v {{vars.BINARY_PATH}}
"""

[tasks.clean]
description = "Clean build artifacts"
run = """
go clean
rm -rf {{vars.BUILD_DIR}}
rm -rf gen/
"""

# Testing tasks
[tasks.test]
description = "Run unit tests"
run = "go tool gotestsum {{vars.GOTESTSUM_OPTIONS}} -- -v ./..."

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = """
go test -v -race -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html || exit 1
echo "Coverage report generated: coverage.html"
"""

[tasks."test:integration"]
description = "Run integration tests (requires Docker for testcontainers)"
run = "echo 'Not implemented for now. See monolith system test…'"

[tasks."test:contract"]
description = "Run contract tests for the todo module (no Docker needed)"
run = "go tool gotestsum {{vars.GOTESTSUM_OPTIONS}} -- -v ./test/contract/..."

[tasks."test:all"]
description = "Run all tests"
depends = ["test", "test:integration", "test:contract"]

[tasks.fmt]
description = "Format all Go code"
run = """
  echo "Formatting all Go code in workspace..."
  gofumpt -l -w .
  """

[tasks.lint]
description = "Run linter"
run = "golangci-lint run"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run all checks (format, vet, lint)"
depends = ["fmt", "vet", "lint", "buf:lint"]

[tasks."arch:check"]
description = "Validate architecture boundaries for this module"
run = "arch-go"

[tasks."arch:graph"]
description = "Show graph architectural dependcies for this module"
run = """
goda graph -cluster \
  "shared(github.com/pivaldi/mmw-todo:all, github.com/pivaldi/mmw-todo/... + github.com/pivaldi/mmw-auth/... + github.com/pivaldi/mmw-notifications/... + github.com/pivaldi/mmw-contracts/...) - github.com/pivaldi/mmw-todo/cmd/migration  - github.com/pivaldi/mmw-todo/internal/infra/persistence/migrations/..." \
  | dot -Tsvg -o graph.svg  &&  echo 'Generated graph: {{config_root}}/graph.svg'

sed -i -E \
    -e 's|https://pkg\\.go\\.dev/github\\.com/([^/@"]+)/([^/@"]+)/([^"]+)|https://github.com/\\1/\\2/tree/master/\\3|g' \\
    -e 's|https://pkg\\.go\\.dev/github\\.com/([^/@"]+)/([^/@"]+)@[^"]*|https://github.com/\\1/\\2|g' \\
    graph.svg
 """

# Dependency tasks
[tasks."deps:tidy"]
description = "Tidy Go dependencies"
run = "go mod tidy"

[tasks."deps:tree"]
description = "Show dependency tree"
run = """
echo "Dependency tree for workspace:"
goda tree "./..."
"""

[tasks."deps:list"]
description = "List all dependencies"
run = """
echo "All dependencies in workspace:"
goda list ./...
"""

[tasks."deps:verify"]
description = "Verify Go dependencies"
run = "go mod verify"

[tasks."metrics:spm"]
description = "Software Package Metrics tool for Go"
run = "spm-go all && spm-go dependencies && echo 'See https://mariocarrion.com/2021/06/18/golang-software-architecture-instability-efferent-afferent.html'"

# Database tasks
[tasks."db:migrate:build"]
description = "Build the database migrations (needed to embed go migrations)"
# sources = ["cmd/migration/*.go", "{{config_root}}/internal/infra/persistence/migrations/scripts/*.go"]
run = """
  go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/ cmd/migration/migrate.go &&
  ls -l {{vars.BUILD_DIR}}/migrate
"""

[tasks."db:migrate:up"]
description = "Run database migrations up"
run = "go run {{vars.COMPILE_OPTIONS}} cmd/migration/*.go up"

[tasks."db:migrate:down"]
description = "Run database migrations down"
run = "go run {{vars.COMPILE_OPTIONS}} cmd/migration/*.go down"

[tasks."db:migrate:create"]
description = "Create new SQL/Go migration"
run = "go run {{vars.COMPILE_OPTIONS}} cmd/migration/*.go create -d {{vars.MIGRATIONS_DIR}}"

[tasks."db:migrate:version"]
description = "Show current migration version"
run = "go run cmd/migration/*.go version"

[tasks."db:migrate:fix"]
description = "Fix the order of migrations"
run = "go run cmd/migration/*.go fix"

[tasks."db:migrate:reset"]
description = "Down all the migrations"
run = "go run cmd/migration/*.go reset"

[tasks."db:migrate:status"]
description = "Show current migration statud"
run = "go run cmd/migration/*.go status"

[tasks."docker:up"]
description = "Start Docker Compose services"
run = "docker-compose -f deployments/docker-compose.yml up -d"

[tasks."docker:down"]
description = "Stop Docker Compose services"
run = "docker-compose -f deployments/docker-compose.yml down"

[tasks."docker:logs"]
description = "View Docker Compose logs"
run = "docker-compose -f deployments/docker-compose.yml logs -f"

# Running tasks
[tasks.run]
description = "Run the application"
# depends = ["generate"] # See https://buf.build/docs/bsr/rate-limits/ for details about BSR rate limiting.
run = "go run {{vars.BINARY_PATH}}/main.go"

[tasks."run:dev"]
description = "Run with hot reload (requires air)"
run = "go tool air"

[tasks."web:start"]
description = "Run with hot reload (requires air)"
run = "cd web/todoapp/ && npm install && npm start"

[tasks."zellif:dev"]
description = "Bootstrap the project with Zellij"
run = "zellij --layout third_party/zeillij/dev-layout.kdl"

# Default task (show help)
[tasks.default]
alias = "help"

[tasks.help]
description = "Display available tasks"
run = """
echo "Available tasks:"
mise tasks
"""

[tasks.doctor]
description = "Show tool versions and key environment info"
run = "{{config_root}}/scripts/common/doctor.sh"
alias = "dr"
